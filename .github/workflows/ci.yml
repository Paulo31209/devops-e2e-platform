name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  TRIVY_VERSION: v0.76.2

# Third-party actions are pinned to a full commit SHA (tag in the comment);
# Dependabot keeps both up to date.
jobs:
  go:
    name: Go lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: Test (race detector + coverage)
        run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: |
          {
            echo '### Test coverage'
            echo '```'
            go tool cover -func=coverage.out | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  helm:
    name: Helm lint & schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install kubeconform
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
      - name: helm lint
        run: |
          helm lint --strict deploy/helm/notes-api
          helm lint --strict deploy/helm/notes-api -f deploy/helm/notes-api/ci/full-values.yaml
      - name: kubeconform (default and full values)
        run: |
          for values in "" "-f deploy/helm/notes-api/ci/full-values.yaml"; do
            # shellcheck disable=SC2086
            helm template notes-api deploy/helm/notes-api $values \
              | kubeconform -strict -summary \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done

  terraform:
    name: Terraform validate & Checkov
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/aws
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: Checkov
        uses: bridgecrewio/checkov-action@83b08f51b20950f791f5caadcc92e336b371eb12 # v12.3143.0
        with:
          directory: infra/terraform
          framework: terraform
          config_file: .checkov.yaml

  security:
    name: Secrets & filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy (dependencies, secrets, Dockerfile & Kubernetes misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          skip-dirs: infra
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  image:
    name: Build, scan, deploy to kind & publish
    needs: [go, helm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: notes-api:ci
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: notes-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # ---- end-to-end test on a throwaway Kubernetes cluster -----------------
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: ci
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2
      - name: Deploy chart to kind
        run: |
          kind load docker-image notes-api:ci --name ci
          helm upgrade --install notes-api deploy/helm/notes-api \
            --namespace notes --create-namespace \
            --set image.repository=notes-api \
            --set image.tag=ci \
            --set image.pullPolicy=Never \
            --wait --timeout 3m
          kubectl -n notes get pods -o wide
      - name: Smoke test through the Service
        run: |
          kubectl -n notes port-forward svc/notes-api 8080:80 &
          for _ in $(seq 1 20); do curl -fs localhost:8080/healthz >/dev/null && break; sleep 1; done
          ./scripts/smoke-test.sh http://localhost:8080
      - name: Debug info on failure
        if: failure()
        run: |
          kubectl -n notes describe pods || true
          kubectl -n notes logs -l app.kubernetes.io/name=notes-api --tail=100 || true

      # ---- publish (main branch only) ----------------------------------------
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=main
      - name: Push multi-arch image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
